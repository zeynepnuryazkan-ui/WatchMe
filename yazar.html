<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatchMe | Yazar Paneli</title>
  <style>
    body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0}
    nav{padding:12px 20px;background:#000;display:flex;gap:12px}
    nav a,nav button{color:#fff;background:none;border:none;text-decoration:none;cursor:pointer}
    .box{max-width:700px;margin:30px auto;background:#1d1d1d;border:1px solid #333;padding:20px;border-radius:10px}
    input,textarea,button{width:100%;padding:10px;margin-top:8px;background:#0f0f0f;color:#fff;border:1px solid #444;border-radius:6px}
    button{background:#e50914;border:none;font-weight:700}
  </style>
</head>
<body>
<nav>
  <a href="dashboard.html">🏠 Keşfet</a>
  <a href="yazar.html">✍️ Yazar Paneli</a>
  <a href="admin.html">🛡️ Admin</a>
  <button onclick="logout()" style="margin-left:auto">Çıkış</button>
</nav>

<div class="box">
  <h2>Video Tanıtım Yükle</h2>
  <p>Sadece yazar/admin hesapları video yükleyebilir.</p>
  <input id="title" placeholder="Video başlığı" />
  <textarea id="description" rows="4" placeholder="Kısa açıklama"></textarea>
  <input id="videoUrl" placeholder="Video URL (YouTube veya MP4)" />
  <button onclick="uploadVideo()">Yayınla</button>
</div>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = 'index.html';

  async function uploadVideo() {
    const title = document.getElementById('title').value;
    const description = document.getElementById('description').value;
    const videoUrl = document.getElementById('videoUrl').value;

    const res = await fetch('/api/videos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ title, description, videoUrl })
    });
    const data = await res.json();
    alert(data.message);
    if (res.ok) window.location.href = 'dashboard.html';
  }

  function logout() {
    localStorage.clear();
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
