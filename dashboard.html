<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatchMe | Keşfet</title>
  <style>
    body{font-family:Arial,sans-serif;background:#141414;color:#fff;margin:0}
    nav{padding:12px 20px;background:#000;display:flex;gap:12px;align-items:center}
    nav a,nav button{color:#fff;background:none;border:none;cursor:pointer;text-decoration:none}
    .container{padding:20px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .card{background:#1f1f1f;border:1px solid #333;border-radius:8px;padding:14px}
    textarea,input,button{width:100%;margin-top:8px;padding:8px;border-radius:6px;border:1px solid #444;background:#101010;color:#fff}
    button{background:#e50914;border:none;cursor:pointer;font-weight:700}
  </style>
</head>
<body>
<nav>
  <a href="dashboard.html">🏠 Keşfet</a>
  <a href="yazar.html">✍️ Yazar Paneli</a>
  <a href="admin.html">🛡️ Admin</a>
  <button onclick="logout()" style="margin-left:auto">Çıkış</button>
</nav>
<div class="container">
  <h2>Video Tanıtımları</h2>
  <div id="videos" class="grid"></div>

  <h3>Admin ile İletişim</h3>
  <input id="subject" placeholder="Konu" />
  <textarea id="message" rows="4" placeholder="Mesajınız"></textarea>
  <button onclick="sendMessage()">Mesajı Gönder</button>
</div>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = 'index.html';

  async function api(url, options = {}) {
    return fetch(url, {
      ...options,
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...(options.headers || {}) }
    });
  }

  async function loadVideos() {
    const res = await fetch('/api/videos');
    const videos = await res.json();
    const el = document.getElementById('videos');
    if (!videos.length) {
      el.innerHTML = '<p>Henüz video yok.</p>';
      return;
    }

    el.innerHTML = videos.map(v => `
      <div class="card">
        <h4>${v.title}</h4>
        <p>${v.description || ''}</p>
        <p><small>Yazar: ${v.writerName}</small></p>
        <a href="${v.videoUrl}" target="_blank">🎬 Videoyu Aç</a>
        <button onclick="reportVideo('${v.id}')">⚠️ Şikayet Et</button>
      </div>
    `).join('');
  }

  async function reportVideo(videoId) {
    const reason = prompt('Şikayet nedeninizi yazın:');
    if (!reason) return;
    const res = await api('/api/reports', { method: 'POST', body: JSON.stringify({ videoId, reason }) });
    const data = await res.json();
    alert(data.message);
  }

  async function sendMessage() {
    const subject = document.getElementById('subject').value;
    const message = document.getElementById('message').value;
    const res = await api('/api/messages', { method: 'POST', body: JSON.stringify({ subject, message }) });
    const data = await res.json();
    alert(data.message);
  }

  function logout() {
    localStorage.clear();
    window.location.href = 'index.html';
  }

  loadVideos();
</script>
</body>
</html>
