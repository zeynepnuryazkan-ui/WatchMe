<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatchMe | Admin Paneli</title>
  <style>
    body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0}
    nav{padding:12px 20px;background:#000;display:flex;gap:12px}
    nav a,nav button{color:#fff;background:none;border:none;text-decoration:none;cursor:pointer}
    .container{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .panel{background:#1d1d1d;border:1px solid #333;border-radius:8px;padding:12px}
    .item{border-left:4px solid #e50914;background:#161616;padding:8px;margin-top:8px}
  </style>
</head>
<body>
<nav>
  <a href="dashboard.html">🏠 Keşfet</a>
  <a href="yazar.html">✍️ Yazar Paneli</a>
  <a href="admin.html">🛡️ Admin</a>
  <button onclick="logout()" style="margin-left:auto">Çıkış</button>
</nav>

<div class="container">
  <div class="panel">
    <h3>Gelen Şikayetler</h3>
    <div id="reports"></div>
  </div>
  <div class="panel">
    <h3>Admin'e Gelen Mesajlar</h3>
    <div id="messages"></div>
  </div>
</div>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = 'index.html';

  async function api(url) {
    return fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  }

  async function loadAdminData() {
    const [reportRes, messageRes] = await Promise.all([
      api('/api/admin/reports'),
      api('/api/admin/messages')
    ]);

    if (!reportRes.ok || !messageRes.ok) {
      alert('Admin hesabı ile giriş yapmalısınız.');
      return;
    }

    const reports = await reportRes.json();
    const messages = await messageRes.json();

    const reportEl = document.getElementById('reports');
    reportEl.innerHTML = reports.length
      ? reports.map(r => `<div class="item"><b>${r.videoTitle}</b><br>${r.reason}<br><small>${r.reporterEmail}</small></div>`).join('')
      : '<p>Henüz şikayet yok.</p>';

    const messageEl = document.getElementById('messages');
    messageEl.innerHTML = messages.length
      ? messages.map(m => `<div class="item"><b>${m.subject}</b><br>${m.message}<br><small>${m.fromEmail}</small></div>`).join('')
      : '<p>Henüz mesaj yok.</p>';
  }

  function logout() {
    localStorage.clear();
    window.location.href = 'index.html';
  }

  loadAdminData();
</script>
</body>
</html>
